#
# Data Source Validator - collections.conf
#
# 7 KV Store collections. All run/queue/result state lives here so a browser
# refresh, disconnect, or search-head-cluster member change never starts a
# duplicate search or loses progress. No secrets are stored in KV Store -
# credentials live only in encrypted storage/passwords.
#

# --- Platforms: top-level grouping ---------------------------------------

[dsv_platforms]
field.platform_id = string
field.name = string
field.description = string
field.sort_order = number
field.enabled = bool
field.created_time = time
field.updated_time = time
accelerated_fields.acc_sort_order = {"sort_order": 1}

# --- Data sources: children of a platform ---------------------------------

[dsv_datasources]
field.datasource_id = string
field.platform_id = string
field.name = string
field.description = string
field.spl_query = string
field.query_hash = string
field.query_version = number
field.sort_order = number
field.enabled = bool
field.stale_threshold_sec = number
field.current_status = string
field.last_result_time = time
field.last_run_id = string
field.created_time = time
field.updated_time = time
accelerated_fields.acc_platform_id = {"platform_id": 1, "sort_order": 1}
accelerated_fields.acc_current_status = {"current_status": 1}

# --- Validation runs: one document per batch --------------------------

[dsv_validation_runs]
field.run_id = string
field.created_time = time
field.created_by = string
field.trigger_type = string
field.status = string
field.total_items = number
field.completed_items = number
field.completed_time = time
accelerated_fields.acc_status = {"status": 1, "created_time": -1}

# --- Validation queue: one ordered item per data source per run -----------

[dsv_validation_queue]
field.queue_id = string
field.run_id = string
field.platform_id = string
field.datasource_id = string
field.order_index = number
field.status = string
field.sid = string
field.dispatched_time = time
field.completed_time = time
field.query_hash = string
field.query_version = number
accelerated_fields.acc_run_order = {"run_id": 1, "order_index": 1}
accelerated_fields.acc_run_status = {"run_id": 1, "status": 1}

# --- Validation results: latest + historical outcome per data source ------

[dsv_validation_results]
field.result_id = string
field.run_id = string
field.queue_id = string
field.datasource_id = string
field.platform_id = string
field.status = string
field.result_count = number
field.query_hash = string
field.query_version = number
field.executed_time = time
field.duration_ms = number
field.error_message = string
accelerated_fields.acc_datasource_time = {"datasource_id": 1, "executed_time": -1}
accelerated_fields.acc_run_id = {"run_id": 1}

# --- Settings: single small collection of app-wide config ------------------

[dsv_settings]
field.setting_id = string
field.value = string
field.updated_time = time
field.updated_by = string

# --- Worker lease: one active worker across search-head-cluster members ----

[dsv_worker_lease]
field.lease_id = string
field.owner = string
field.acquired_time = time
field.heartbeat_time = time
field.expires_time = time
