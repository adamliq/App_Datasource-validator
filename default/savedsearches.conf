#
# Data Source Validator - savedsearches.conf
#
# Two housekeeping jobs, both scoped entirely to this app's own KV Store
# collections (via the transforms.conf lookup definitions) - neither
# touches customer indexes or runs with elevated privilege beyond what
# the scheduling user already has on this app's own objects.
#

[DSV - Purge Old Validation History]
description = Daily retention job: drops completed/cancelled validation_runs and validation_queue items older than 30 days, and validation_results older than 180 days. Adjust the relative_time() windows below to match your retention needs.
search = | inputlookup dsv_validation_runs_lookup \
| where NOT ((status="COMPLETED" OR status="CANCELLED") AND completed_time < relative_time(now(), "-30d")) \
| outputlookup dsv_validation_runs_lookup \
| inputlookup dsv_validation_queue_lookup \
| where NOT ((status="DONE" OR status="ERROR" OR status="CANCELLED") AND completed_time < relative_time(now(), "-30d")) \
| outputlookup dsv_validation_queue_lookup \
| inputlookup dsv_validation_results_lookup \
| where executed_time >= relative_time(now(), "-180d") \
| outputlookup dsv_validation_results_lookup
dispatch.earliest_time = 0
dispatch.latest_time = now
cron_schedule = 0 3 * * *
enableSched = 1
is_scheduled = 1
schedule_priority = default
alert.track = 0
disabled = 0

[DSV - Worker Heartbeat Staleness Check]
description = Runs every 5 minutes; fires when the single validation worker's KV Store lease hasn't heartbeat-renewed in over 5 minutes, meaning no search-head-cluster member is currently dispatching validations. Attach your own alert action (email, webhook, etc.) to this saved search to get notified - none is configured by default.
search = | inputlookup dsv_worker_lease_lookup \
| eval heartbeat_epoch=strptime(heartbeat_time, "%Y-%m-%dT%H:%M:%S.%6NZ") \
| eval seconds_since_heartbeat=now()-heartbeat_epoch \
| where seconds_since_heartbeat > 300 \
| eval reason="validation worker lease heartbeat is stale"
dispatch.earliest_time = 0
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
is_scheduled = 1
schedule_priority = default
alert.track = 1
alert.severity = 4
alert.suppress = 0
disabled = 0
