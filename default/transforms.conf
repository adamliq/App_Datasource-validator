#
# Data Source Validator - transforms.conf
#
# Exposes 4 of the 7 KV Store collections as lookup definitions purely so
# default/savedsearches.conf's housekeeping searches can read/rewrite
# them with plain SPL (inputlookup/outputlookup) instead of needing a
# custom search command. The app's own REST handlers and the worker
# never go through these - they use app.splunk_client's direct KV Store
# REST calls. dsv_platforms and dsv_datasources (small, user-curated,
# never auto-purged) and dsv_settings (tiny key/value) are intentionally
# not exposed here - there is nothing that needs to bulk-rewrite them.
#

[dsv_validation_runs_lookup]
external_type = kvstore
collection = dsv_validation_runs
fields_list = _key, run_id, created_time, created_by, trigger_type, status, total_items, completed_items, completed_time

[dsv_validation_queue_lookup]
external_type = kvstore
collection = dsv_validation_queue
fields_list = _key, queue_id, run_id, platform_id, datasource_id, order_index, status, sid, dispatched_time, completed_time, query_hash, query_version

[dsv_validation_results_lookup]
external_type = kvstore
collection = dsv_validation_results
fields_list = _key, result_id, run_id, queue_id, datasource_id, platform_id, status, result_count, query_hash, query_version, executed_time, duration_ms, error_message

[dsv_worker_lease_lookup]
external_type = kvstore
collection = dsv_worker_lease
fields_list = _key, lease_id, owner, acquired_time, heartbeat_time, expires_time
