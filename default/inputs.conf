#
# Data Source Validator - inputs.conf
#
# dsv_validation_worker is the single control-loop modular input: the only
# dispatcher of validation search jobs (see architecture in HANDOFF.md). It
# does not itself collect external data; each tick it reads/writes KV Store
# run/queue/result state and dispatches at most one search job. Its own
# operational events go to the app's JSON log file (bin/app/logging_utils.py),
# which default/props.conf parses once picked up by the platform's standard
# monitor of $SPLUNK_HOME/var/log/splunk - hence index = _internal below.
#
# Disabled by default: the setup page enables this input only after the
# service-account credential has been stored and app.conf's
# is_configured flips to true.
#

[dsv_validation_worker://main]
disabled = 1
interval = 5
index = _internal
python.required = 3.9,3.13
