#
# Data Source Validator - restmap.conf
#
# 8 authenticated REST endpoints, each a persistent Python handler
# (splunk.persistconn.PersistentServerConnectionApplication subclass, see
# bin/rest_*.py). All require a logged-in Splunk session
# (passSystemAuth = false, no anonymous access) and are further gated per
# HTTP method by the custom capabilities defined in authorize.conf. Handlers
# for a path with an id (e.g. /platforms/<id>) receive the extra path
# component via the standard persistent-handler path_info mechanism, so one
# match stanza per resource, not one per id, is required - a separate
# trailing-slash stanza for the item path (e.g. /platforms/) is NOT used:
# Splunk's dispatcher does not disambiguate it from the bare collection
# match, and ends up always routing to whichever one wins that collision
# (confirmed live - every request landed on the item-only handler, even
# collection-level ones). handle_get/handle_post branch on
# request.path_segments instead.
#

[script:dsv_config]
match = /datasource_validator/config
script = rest_config.py
scripttype = persist
handler = rest_config.DsvConfigHandler
python.version = python3
python.required = 3.9,3.13
capability.get = dsv_admin_config
capability.post = dsv_admin_config
output_modes = json
passSystemAuth = false

[script:dsv_platforms]
match = /datasource_validator/platforms
script = rest_platforms.py
scripttype = persist
handler = rest_platforms.DsvPlatformsHandler
python.version = python3
python.required = 3.9,3.13
capability.get = dsv_view_results
capability.put = dsv_manage_datasources
capability.post = dsv_manage_datasources
capability.delete = dsv_manage_datasources
output_modes = json
passSystemAuth = false

