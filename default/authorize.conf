#
# Data Source Validator - authorize.conf
#
# 4 custom capabilities gate the app's REST endpoints (see restmap.conf).
# 4 roles: three human-facing roles that import the built-in "user" role,
# and dsv_service - a least-privilege, non-importing role intended only for
# the customer-provisioned service account that executes validation searches.
#

# --- Custom capabilities -----------------------------------------------

[capability::dsv_admin_config]

[capability::dsv_manage_datasources]

[capability::dsv_run_validation]

[capability::dsv_view_results]

# --- Human-facing roles --------------------------------------------------

[role_dsv_admin]
importRoles = user
dsv_admin_config = enabled
dsv_manage_datasources = enabled
dsv_run_validation = enabled
dsv_view_results = enabled
srchIndexesAllowed = *
srchIndexesDefault = main

[role_dsv_editor]
importRoles = user
dsv_admin_config = disabled
dsv_manage_datasources = enabled
dsv_run_validation = enabled
dsv_view_results = enabled

[role_dsv_viewer]
importRoles = user
dsv_admin_config = disabled
dsv_manage_datasources = disabled
dsv_run_validation = disabled
dsv_view_results = enabled

# --- Built-in admin roles --------------------------------------------------
# Installing this app never automatically grants its own custom capabilities
# to any pre-existing role, including built-in admin ones - a customer would
# otherwise have to separately assign role_dsv_admin (or hand-check these
# capabilities) before the setup page is usable at all. Grant them directly
# to Splunk's own built-in admin roles instead. This only adds capability
# keys to [role_admin]/[role_sc_admin] - never importRoles/grantableRoles -
# so it merges with (does not replace) whatever those roles already grant;
# confirmed safe against AppInspect's
# check_import_roles_and_grantable_roles_for_builtin_roles.

[role_admin]
dsv_admin_config = enabled
dsv_manage_datasources = enabled
dsv_run_validation = enabled
dsv_view_results = enabled

[role_sc_admin]
dsv_admin_config = enabled
dsv_manage_datasources = enabled
dsv_run_validation = enabled
dsv_view_results = enabled

# --- Service role (dedicated search identity) -----------------------------
# No importRoles: this role starts with zero inherited capabilities. It is
# never used interactively and is granted no admin/config capabilities of
# its own - only the ability to run non-real-time searches against an
# explicit, deployment-specific index list.
#
# srchIndexesAllowed/srchIndexesDefault below default to "main" only so the
# app is installable and demoable out of the box - "main" almost certainly
# does NOT hold the customer's real data (Firewall, EDR, etc. per the
# platform/data-source model in README.md). Every deployment MUST edit
# these two settings (here or via Splunk Web > Roles) to the actual index
# list the validation searches need before going into real use. Never set
# this to "*" - that defeats the least-privilege design of this role.

[role_dsv_service]
importRoles =
srchIndexesAllowed = main
srchIndexesDefault = main
srchJobsQuota = 4
rtSrchJobsQuota = 0
cumulativeSrchJobsQuota = 4
cumulativeRTSrchJobsQuota = 0
srchDiskQuota = 500
srchTimeWin = 0
dsv_admin_config = disabled
dsv_manage_datasources = disabled
dsv_run_validation = disabled
dsv_view_results = disabled
