#
# Data Source Validator - authorize.conf
#
# 4 custom capabilities gate the app's REST endpoints (see restmap.conf).
# 4 roles: three human-facing roles that import the built-in "user" role,
# and dsv_service - a least-privilege, non-importing role intended only for
# the customer-provisioned service account that executes validation searches.
#

# --- Custom capabilities -----------------------------------------------

[capability::dsv_admin_config]

[capability::dsv_manage_datasources]

[capability::dsv_run_validation]

[capability::dsv_view_results]

# --- Human-facing roles --------------------------------------------------

[role_dsv_admin]
importRoles = user
dsv_admin_config = enabled
dsv_manage_datasources = enabled
dsv_run_validation = enabled
dsv_view_results = enabled
srchIndexesAllowed = *
srchIndexesDefault = main

[role_dsv_editor]
importRoles = user
dsv_admin_config = disabled
dsv_manage_datasources = enabled
dsv_run_validation = enabled
dsv_view_results = enabled

[role_dsv_viewer]
importRoles = user
dsv_admin_config = disabled
dsv_manage_datasources = disabled
dsv_run_validation = disabled
dsv_view_results = enabled

# --- Service role (dedicated search identity) -----------------------------
# No importRoles: this role starts with zero inherited capabilities. It is
# never used interactively and is granted no admin/config capabilities of
# its own - only the ability to run non-real-time searches against an
# explicit, deployment-specific index list. Fill in srchIndexesAllowed for
# your environment; do not set it to "*".

[role_dsv_service]
importRoles =
srchIndexesAllowed = REPLACE_WITH_ALLOWED_INDEXES
srchIndexesDefault = REPLACE_WITH_DEFAULT_INDEX
srchJobsQuota = 4
rtSrchJobsQuota = 0
cumulativeSrchJobsQuota = 4
cumulativeRTSrchJobsQuota = 0
srchDiskQuota = 500
srchTimeWin = 0
dsv_admin_config = disabled
dsv_manage_datasources = disabled
dsv_run_validation = disabled
dsv_view_results = disabled
