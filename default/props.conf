#
# Data Source Validator - props.conf
#
# The app never writes to a Splunk index directly (no HEC, no custom index).
# Its own operational log (bin/app/logging_utils.py) writes one JSON object
# per line to $SPLUNK_HOME/var/log/splunk/datasource_validator*.log, which
# Splunk's standard internal log monitor already picks up into _internal.
# This stanza only assigns those files a dedicated sourcetype and tells
# search-time parsing how to read the JSON; "..." is a Splunk source-match
# wildcard for "any number of leading path segments".
#

[source::.../var/log/splunk/datasource_validator*.log]
sourcetype = dsv:internal

[dsv:internal]
category = Application
disabled = false
pulldown_type = true
NO_BINARY_CHECK = true
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = json
TIME_PREFIX = "timestamp":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6NZ
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 100000
