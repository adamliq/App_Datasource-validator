#
# Data Source Validator - web.conf
#
# Exposes the 8 restmap.conf endpoints through Splunk Web's simplified
# REST proxy (/[locale]/splunkd/__raw/... and /api/...) so app.js can call
# them with the browser's own authenticated session. Exposure here does not
# bypass authentication or the per-method capability gates in restmap.conf -
# it only makes the path routable from the web tier. "**" matches both the
# bare collection path and a path with an id appended, matching the single
# merged restmap handler each of these backs (see restmap.conf's header
# comment for why collection and item requests share one handler/stanza).
#

[expose:dsv_config]
pattern = datasource_validator/config
methods = GET,POST

[expose:dsv_platforms]
pattern = datasource_validator/platforms/**
methods = GET,PUT,POST,DELETE

[expose:dsv_datasources]
pattern = datasource_validator/datasources/**
methods = GET,PUT,POST,DELETE

[expose:dsv_runs]
pattern = datasource_validator/run/**
methods = GET,POST,DELETE

[expose:dsv_queue]
pattern = datasource_validator/queue
methods = GET

[expose:dsv_results]
pattern = datasource_validator/results
methods = GET

[expose:dsv_query_test]
pattern = datasource_validator/query/test
methods = POST

[expose:dsv_health]
pattern = datasource_validator/health
methods = GET
